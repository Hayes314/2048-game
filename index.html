<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>2048 Ultimate</title>
  <style>
    :root {
      --bg-1: #f7f2ff;
      --bg-2: #edf3ff;
      --panel: rgba(255, 255, 255, 0.74);
      --panel-strong: rgba(255,255,255,0.92);
      --surface: rgba(255,255,255,0.38);
      --text: #2a2f43;
      --muted: #687692;
      --accent: #7a6af6;
      --accent-2: #4dc9be;
      --accent-3: #f7b955;
      --danger: #ff6b7a;
      --board-bg: #b9aee8;
      --cell-bg: rgba(255,255,255,0.26);
      --shadow: 0 18px 50px rgba(40, 34, 78, 0.18);
      --tile-2: #faf7ff;
      --tile-4: #f0ecff;
      --tile-8: #ffdcae;
      --tile-16: #ffc780;
      --tile-32: #ffae72;
      --tile-64: #ff8d61;
      --tile-128: #f6d767;
      --tile-256: #f0c93d;
      --tile-512: #d8b04a;
      --tile-1024: #7f70f9;
      --tile-2048: #6a5ef8;
      --tile-4096: #49b39a;
      --tile-8192: #2e9fc9;
      --tile-16384: #d57dff;
      --tile-32768: #ff5d90;
      --tile-65536: #1f243a;
      --font: "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Arial", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: var(--font);
      overscroll-behavior: none;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body { display: flex; align-items: center; justify-content: center; padding: clamp(10px, 2vh, 22px); }

    #app {
      width: min(100%, 600px);
      min-height: min(94vh, 940px);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 18px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
    }

    .brand {
      font-size: clamp(1.5rem, 2.4vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    .top-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill, button, select, input {
      font: inherit;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.45);
      border: 1px solid rgba(255,255,255,0.6);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 10px;
      min-height: 38px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    select, input[type="color"] {
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(138,146,179,0.28);
      border-radius: 12px;
      color: var(--text);
      padding: 8px 10px;
      outline: none;
    }

    select {
      min-width: 116px;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) calc(50% - 2px),
        calc(100% - 12px) calc(50% - 2px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 28px;
    }

    input[type="color"] {
      width: 42px;
      height: 38px;
      min-width: 42px;
      padding: 4px;
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1;
    }

    .primary-btn, .secondary-btn, .icon-btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 10px 20px rgba(48,44,81,0.08);
    }

    .secondary-btn {
      background: rgba(255,255,255,0.5);
      color: var(--text);
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.56);
      color: var(--text);
    }

    button:active { transform: translateY(1px) scale(0.99); }

    .status-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .score-box {
      background: rgba(255,255,255,0.44);
      border-radius: 16px;
      padding: 10px 12px;
      text-align: center;
      border: 1px solid rgba(153,160,196,0.18);
    }

    .score-label {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .score-value {
      display: block;
      margin-top: 6px;
      font-size: clamp(1.08rem, 2vw, 1.8rem);
      font-weight: 900;
      color: var(--text);
    }

    .board-shell {
      padding: 12px;
      border-radius: 28px;
      background: rgba(255,255,255,0.26);
      border: 1px solid rgba(150,157,194,0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .board {
      position: relative;
      display: grid;
      gap: 10px;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--board-bg);
      border-radius: 20px;
      padding: 10px;
      touch-action: none;
      user-select: none;
    }

    .cell {
      position: relative;
      background: var(--cell-bg);
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .tile {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: rgba(30,35,48,0.86);
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08), 0 5px 10px rgba(30,35,48,0.08);
      animation: popIn 0.18s ease-out;
      transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s ease;
    }

    .tile[data-value="2"], .tile[data-value="4"] { color: rgba(56,61,74,0.9); }
    .tile[data-value="128"], .tile[data-value="256"], .tile[data-value="512"], .tile[data-value="1024"], .tile[data-value="2048"], .tile[data-value="4096"], .tile[data-value="8192"], .tile[data-value="16384"], .tile[data-value="32768"], .tile[data-value="65536"] { color: rgba(255,255,255,0.96); }

    .tile.merged { animation: mergePulse 0.22s ease-out; }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      70% { transform: scale(1.07); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes mergePulse {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.09); filter: brightness(1.1); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(8px);
      background: rgba(29,31,42,0.92);
      color: white;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 12px 24px rgba(18, 20, 31, 0.18);
      z-index: 70;
      max-width: min(80vw, 420px);
    }

    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 22, 35, 0.56);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 90;
      opacity: 1;
      transition: opacity 0.2s ease;
      padding: 18px;
    }

    .modal-overlay.hidden { opacity: 0; pointer-events: none; }

    .modal {
      width: min(100%, 530px);
      background: rgba(255,255,255,0.95);
      border-radius: 24px;
      border: 1px solid rgba(150,157,194,0.32);
      box-shadow: 0 22px 56px rgba(18,20,40,0.18);
      padding: 18px 16px 16px;
      color: var(--text);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .modal-header h3 { margin: 0; font-size: 1.2rem; }

    .save-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .save-card {
      background: rgba(245,247,255,0.9);
      border-radius: 16px;
      border: 1px solid rgba(160,168,204,0.26);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .save-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .save-meta strong {
      color: var(--text);
      font-size: 1rem;
    }

    .save-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .save-actions button {
      flex: 1;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      padding: 8px 10px;
      cursor: pointer;
    }

    .save-slot {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }

    .load-slot {
      background: rgba(255,255,255,0.72);
      color: var(--text);
    }

    .hidden { display: none !important; }

    @media (max-width: 560px) {
      #app {
        border-radius: 0;
        width: 100%;
        min-height: 100%;
        padding: 14px 12px 12px;
      }

      .topbar, .toolbar { align-items: stretch; }
      .toolbar { gap: 8px; }
      .toolbar-group { width: 100%; }
      .top-controls { justify-content: flex-start; width: 100%; }
      .secondary-btn, .primary-btn, .icon-btn { flex: 1; }
      .board-shell { padding: 10px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="brand" data-text="title">2048</div>
      <div class="top-controls">
        <div class="pill" data-text="colors">Theme</div>
        <input id="themeBgInput" type="color" aria-label="Background color" />
        <input id="themePanelInput" type="color" aria-label="Panel color" />
        <input id="themeAccentInput" type="color" aria-label="Accent color" />
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-group">
        <label class="pill" data-text="mode">Mode</label>
        <select id="modeSelect" aria-label="Game mode">
          <option value="classic" data-text="classic">Classic 2048</option>
          <option value="obstacle" data-text="obstacle">Obstacle</option>
          <option value="custom" data-text="custom">Custom</option>
          <option value="duel" data-text="duel">2 Player</option>
          <option value="ai" data-text="ai">AI</option>
        </select>

        <div id="customSettings" class="toolbar-group hidden">
          <label class="pill" data-text="boardSize">Board</label>
          <select id="customSizeSelect">
            <option value="4">4 x 4</option>
            <option value="5">5 x 5</option>
            <option value="6">6 x 6</option>
          </select>
          <label class="pill" data-text="target">Target</label>
          <select id="customTargetSelect">
            <option value="1024">1024</option>
            <option value="2048">2048</option>
            <option value="4096" selected>4096</option>
            <option value="8192">8192</option>
            <option value="16384">16384</option>
          </select>
        </div>
      </div>

      <div class="toolbar-group">
        <button class="secondary-btn" id="undoBtn" data-text="undo">Undo</button>
        <button class="secondary-btn" id="restartBtn" data-text="restart">Restart</button>
        <button class="primary-btn" id="saveBtn" data-text="save">Save</button>
        <button class="icon-btn" id="fullscreenBtn" title="Full Screen">⛶</button>
      </div>
    </div>

    <div class="status-row">
      <div class="score-box">
        <span class="score-label" data-text="score">Score</span>
        <span class="score-value" id="scoreValue">0</span>
      </div>
      <div class="score-box">
        <span class="score-label" data-text="best">Best</span>
        <span class="score-value" id="bestValue">0</span>
      </div>
      <div class="score-box">
        <span class="score-label" data-text="turn">Turn</span>
        <span class="score-value" id="turnValue">P1</span>
      </div>
    </div>

    <div class="board-shell">
      <div class="board" id="board" aria-label="2048 game board"></div>
    </div>

    <div class="top-controls" style="justify-content:flex-start;">
      <label class="pill" data-text="language">Language</label>
      <select id="langSelect">
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay hidden" id="saveModal">
    <div class="modal">
      <div class="modal-header">
        <h3 data-text="savedGames">Saved Games</h3>
        <button class="secondary-btn" id="closeSaveModal" data-text="close">Close</button>
      </div>
      <div class="save-list" id="saveList"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = {
      best: "2048BestScoreV1",
      saveSlots: "2048SaveSlotsV1",
      language: "2048LanguageV1",
      theme: "2048ThemeV1"
    };

    const i18n = {
      "zh-Hant": {
        title: "2048",
        colors: "調色系",
        mode: "玩法",
        classic: "經典 2048",
        obstacle: "障礙模式",
        custom: "自定義",
        duel: "雙人",
        ai: "AI",
        boardSize: "棋盤大小",
        target: "目標值",
        score: "分數",
        best: "最佳",
        turn: "回合",
        undo: "回復上一步",
        restart: "重新開始",
        save: "存檔",
        close: "關閉",
        savedGames: "存檔列表",
        language: "語言",
        empty: "空",
        newSave: "新存檔",
        load: "讀取",
        overwrite: "覆蓋",
        noMoves: "目前不能移動",
        saved: "已存檔",
        loaded: "已讀取",
        won: "已達目標，繼續挑戰更高分！",
        lost: "遊戲結束，沒有可移動的空間。",
        restartConfirm: "確定要重新開始嗎？",
        noHistory: "沒有可回復的步驟",
        fullscreen: "全螢幕",
        p1: "P1",
        p2: "P2",
        aiTurn: "AI 回合",
        humanTurn: "玩家回合",
        duelWin: "勝出者：",
        draw: "平局"
      },
      "zh-CN": {
        title: "2048",
        colors: "调色系",
        mode: "玩法",
        classic: "经典 2048",
        obstacle: "障碍模式",
        custom: "自定义",
        duel: "双人",
        ai: "AI",
        boardSize: "棋盘大小",
        target: "目标值",
        score: "分数",
        best: "最佳",
        turn: "回合",
        undo: "恢复上一步",
        restart: "重新开始",
        save: "存档",
        close: "关闭",
        savedGames: "存档列表",
        language: "语言",
        empty: "空",
        newSave: "新存档",
        load: "读取",
        overwrite: "覆盖",
        noMoves: "目前不能移动",
        saved: "已存档",
        loaded: "已读取",
        won: "已达目标，继续挑战更高分！",
        lost: "游戏结束，没有可移动的空间。",
        restartConfirm: "确定要重新开始吗？",
        noHistory: "没有可恢复的步骤",
        fullscreen: "全屏",
        p1: "P1",
        p2: "P2",
        aiTurn: "AI 回合",
        humanTurn: "玩家回合",
        duelWin: "胜出者：",
        draw: "平局"
      },
      en: {
        title: "2048",
        colors: "Theme",
        mode: "Mode",
        classic: "Classic 2048",
        obstacle: "Obstacle Mode",
        custom: "Custom",
        duel: "2 Player",
        ai: "AI",
        boardSize: "Board",
        target: "Target",
        score: "Score",
        best: "Best",
        turn: "Turn",
        undo: "Undo",
        restart: "Restart",
        save: "Save",
        close: "Close",
        savedGames: "Saved Games",
        language: "Language",
        empty: "Empty",
        newSave: "New Save",
        load: "Load",
        overwrite: "Overwrite",
        noMoves: "No moves available",
        saved: "Saved",
        loaded: "Loaded",
        won: "Goal reached! Keep going!",
        lost: "No more moves available.",
        restartConfirm: "Restart the game?",
        noHistory: "Nothing to undo",
        fullscreen: "Full Screen",
        p1: "P1",
        p2: "P2",
        aiTurn: "AI turn",
        humanTurn: "Player turn",
        duelWin: "Winner: ",
        draw: "Draw"
      }
    };

    const DEFAULT_THEME = { bg1: "#f7f2ff", bg2: "#edf3ff", panel: "#ffffff", accent: "#7a6af6" };

    const game = {
      mode: "classic",
      size: 4,
      target: 2048,
      score: 0,
      best: 0,
      board: [],
      history: [],
      lang: "zh-Hant",
      wonOnce: false,
      state: "playing",
      theme: { ...DEFAULT_THEME },
      currentPlayer: 0,
      playerScores: [0, 0],
      aiBusy: false,
      aiDelay: 320
    };

    const els = {};
    const saveSlots = Array.from({ length: 5 }, (_, i) => `slot-${i + 1}`);

    function init() {
      cacheElements();
      initThemeFromStorage();
      initLanguageFromStorage();
      bindEvents();
      applyLanguage();
      applyTheme();
      loadBest();
      startNewGame();
      renderSaveModal();
    }

    function cacheElements() {
      els.modeSelect = document.getElementById("modeSelect");
      els.customSettings = document.getElementById("customSettings");
      els.customSizeSelect = document.getElementById("customSizeSelect");
      els.customTargetSelect = document.getElementById("customTargetSelect");
      els.undoBtn = document.getElementById("undoBtn");
      els.restartBtn = document.getElementById("restartBtn");
      els.saveBtn = document.getElementById("saveBtn");
      els.fullscreenBtn = document.getElementById("fullscreenBtn");
      els.langSelect = document.getElementById("langSelect");
      els.board = document.getElementById("board");
      els.scoreValue = document.getElementById("scoreValue");
      els.bestValue = document.getElementById("bestValue");
      els.turnValue = document.getElementById("turnValue");
      els.toast = document.getElementById("toast");
      els.saveModal = document.getElementById("saveModal");
      els.saveList = document.getElementById("saveList");
      els.closeSaveModal = document.getElementById("closeSaveModal");
      els.themeBgInput = document.getElementById("themeBgInput");
      els.themePanelInput = document.getElementById("themePanelInput");
      els.themeAccentInput = document.getElementById("themeAccentInput");
    }

    function bindEvents() {
      els.modeSelect.addEventListener("change", () => {
        game.mode = els.modeSelect.value;
        updateModeSettings();
        startNewGame();
      });

      els.customSizeSelect.addEventListener("change", () => {
        if (game.mode === "custom") startNewGame();
      });

      els.customTargetSelect.addEventListener("change", () => {
        if (game.mode === "custom") startNewGame();
      });

      els.undoBtn.addEventListener("click", undoMove);
      els.restartBtn.addEventListener("click", () => {
        if (confirm(i18n[game.lang].restartConfirm)) startNewGame();
      });
      els.saveBtn.addEventListener("click", openSaveModal);
      els.closeSaveModal.addEventListener("click", closeSaveModal);

      els.langSelect.addEventListener("change", () => {
        game.lang = els.langSelect.value;
        localStorage.setItem(STORAGE_KEYS.language, game.lang);
        applyLanguage();
        renderSaveModal();
      });

      els.fullscreenBtn.addEventListener("click", toggleFullScreen);

      els.themeBgInput.addEventListener("input", () => {
        const value = els.themeBgInput.value;
        const [r, g, b] = hexToRgb(value);
        const dark = [r, g, b].map(v => Math.max(0, Math.min(255, v - 12))).join(",");
        document.documentElement.style.setProperty("--bg-1", value);
        document.documentElement.style.setProperty("--bg-2", `rgb(${dark})`);
        game.theme.bg1 = value;
        game.theme.bg2 = `rgb(${dark})`;
        persistTheme();
      });

      els.themePanelInput.addEventListener("input", () => {
        const value = els.themePanelInput.value;
        document.documentElement.style.setProperty("--panel", value);
        game.theme.panel = value;
        persistTheme();
      });

      els.themeAccentInput.addEventListener("input", () => {
        const value = els.themeAccentInput.value;
        document.documentElement.style.setProperty("--accent", value);
        game.theme.accent = value;
        persistTheme();
      });

      document.addEventListener("keydown", handleKeydown);

      document.addEventListener("touchstart", (event) => {
        const t = event.changedTouches[0];
        if (t) document.__touchStart = { x: t.clientX, y: t.clientY };
      }, { passive: true });

      document.addEventListener("touchend", (event) => {
        const start = document.__touchStart;
        if (!start) return;
        const t = event.changedTouches[0];
        if (!t) return;
        const dx = t.clientX - start.x;
        const dy = t.clientY - start.y;
        const absX = Math.abs(dx), absY = Math.abs(dy);
        if (Math.max(absX, absY) < 26) return;
        if (absX > absY) move(dx > 0 ? "right" : "left");
        else move(dy > 0 ? "down" : "up");
        delete document.__touchStart;
      }, { passive: true });

      document.addEventListener("click", (event) => {
        const action = event.target.dataset.action;
        if (!action) return;
        if (action === "save-slot") saveGame(event.target.dataset.slot);
        if (action === "load-slot") loadGame(event.target.dataset.slot);
      });

      document.addEventListener("touchmove", (event) => {
        if (event.cancelable) event.preventDefault();
      }, { passive: false });
      document.body.addEventListener("touchmove", (event) => {
        if (event.cancelable) event.preventDefault();
      }, { passive: false });
    }

    function hexToRgb(hex) {
      const clean = hex.replace("#", "");
      const full = clean.length === 3 ? clean.split("").map(ch => ch + ch).join("") : clean;
      const num = parseInt(full, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    function initThemeFromStorage() {
      const saved = localStorage.getItem(STORAGE_KEYS.theme);
      if (!saved) return;
      try {
        const parsed = JSON.parse(saved);
        game.theme = { ...DEFAULT_THEME, ...parsed };
      } catch (e) {
        game.theme = { ...DEFAULT_THEME };
      }
    }

    function persistTheme() {
      localStorage.setItem(STORAGE_KEYS.theme, JSON.stringify(game.theme));
    }

    function initLanguageFromStorage() {
      const savedLang = localStorage.getItem(STORAGE_KEYS.language);
      if (savedLang && i18n[savedLang]) game.lang = savedLang;
    }

    function loadBest() {
      const best = Number(localStorage.getItem(STORAGE_KEYS.best) || 0);
      game.best = Number.isFinite(best) ? best : 0;
    }

    function updateModeSettings() {
      const isCustom = game.mode === "custom";
      els.customSettings.classList.toggle("hidden", !isCustom);

      if (game.mode === "classic") {
        game.size = 4; game.target = 2048;
      } else if (game.mode === "obstacle") {
        game.size = 4; game.target = 4096;
      } else if (game.mode === "duel") {
        game.size = 4; game.target = 2048;
      } else if (game.mode === "ai") {
        game.size = 4; game.target = 2048;
      } else {
        game.size = Number(els.customSizeSelect.value || 4);
        game.target = Number(els.customTargetSelect.value || 4096);
      }
    }

    function applyLanguage() {
      const dict = i18n[game.lang] || i18n["zh-Hant"];
      document.documentElement.lang = game.lang;
      els.langSelect.value = game.lang;
      document.querySelectorAll("[data-text]").forEach((node) => {
        const key = node.getAttribute("data-text");
        if (dict[key]) node.textContent = dict[key];
      });
      document.querySelectorAll("option[data-text]").forEach((option) => {
        const key = option.getAttribute("data-text");
        if (dict[key]) option.textContent = dict[key];
      });
      els.turnValue.textContent = getTurnLabel();
      const targetValueEl = document.getElementById("targetValue");
      if (targetValueEl) targetValueEl.textContent = String(game.target);
    }

    function applyTheme() {
      const theme = game.theme || DEFAULT_THEME;
      document.documentElement.style.setProperty("--bg-1", theme.bg1 || DEFAULT_THEME.bg1);
      document.documentElement.style.setProperty("--bg-2", theme.bg2 || DEFAULT_THEME.bg2);
      document.documentElement.style.setProperty("--panel", theme.panel || DEFAULT_THEME.panel);
      document.documentElement.style.setProperty("--accent", theme.accent || DEFAULT_THEME.accent);
      if (theme.bg1) els.themeBgInput.value = theme.bg1;
      if (theme.panel) els.themePanelInput.value = theme.panel;
      if (theme.accent) els.themeAccentInput.value = theme.accent;
    }

    function emptyBoard(size) {
      return Array.from({ length: size }, () => Array(size).fill(0));
    }

    function cloneBoard(board) {
      return board.map(row => [...row]);
    }

    function startNewGame() {
      updateModeSettings();
      game.board = emptyBoard(game.size);
      game.score = 0;
      game.history = [];
      game.wonOnce = false;
      game.state = "playing";
      game.aiBusy = false;
      game.currentPlayer = 0;
      game.playerScores = [0, 0];

      spawnRandomTile(game.board);
      spawnRandomTile(game.board);

      els.scoreValue.textContent = "0";
      els.bestValue.textContent = String(game.best);
      els.turnValue.textContent = getTurnLabel();
      renderBoard();
      validateBoard();
    }

    function getTurnLabel() {
      const dict = i18n[game.lang] || i18n["zh-Hant"];
      if (game.mode === "duel") return game.currentPlayer === 0 ? dict.p1 : dict.p2;
      if (game.mode === "ai") return game.aiBusy ? dict.aiTurn : dict.humanTurn;
      return dict.p1;
    }

    function spawnRandomTile(board) {
      const empties = [];
      for (let y = 0; y < board.length; y++) {
        for (let x = 0; x < board[y].length; x++) {
          if (board[y][x] === 0) empties.push([x, y]);
        }
      }
      if (!empties.length) return false;
      const [x, y] = empties[Math.floor(Math.random() * empties.length)];
      board[y][x] = Math.random() < 0.9 ? 2 : 4;
      return true;
    }

    function pushHistory() {
      game.history.push({
        board: cloneBoard(game.board),
        score: game.score,
        playerScores: [...game.playerScores],
        currentPlayer: game.currentPlayer,
        mode: game.mode,
        target: game.target,
        size: game.size
      });
      if (game.history.length > 24) game.history.shift();
    }

    function undoMove() {
      const prev = game.history.pop();
      if (!prev) {
        showToast(i18n[game.lang].noHistory);
        return;
      }
      game.board = cloneBoard(prev.board);
      game.score = prev.score;
      game.playerScores = [...prev.playerScores];
      game.currentPlayer = prev.currentPlayer;
      game.target = prev.target;
      game.size = prev.size;
      game.mode = prev.mode;
      game.state = "playing";
      game.aiBusy = false;
      els.modeSelect.value = game.mode;
      updateModeSettings();
      renderBoard();
      els.scoreValue.textContent = String(game.score);
      els.bestValue.textContent = String(game.best);
      els.turnValue.textContent = getTurnLabel();
      validateBoard();
    }

    function renderBoard() {
      const size = game.size;
      els.board.style.gridTemplateColumns = `repeat(${size}, minmax(0, 1fr))`;
      els.board.innerHTML = "";

      const fragments = [];
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          const value = game.board[y][x];
          if (value !== 0) {
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.dataset.value = String(value);
            tile.textContent = value === -1 ? "■" : value;
            tile.style.background = value === -1 ? "linear-gradient(135deg, #7e88a6, #4e586f)" : getTileColor(value);
            tile.style.fontSize = value === -1 ? "0.8rem" : getTileFontSize(value);
            cell.appendChild(tile);
          }
          fragments.push(cell);
        }
      }
      els.board.append(...fragments);
      els.scoreValue.textContent = String(game.score);
      els.bestValue.textContent = String(game.best);
      els.turnValue.textContent = getTurnLabel();
      const targetValueEl = document.getElementById("targetValue");
      if (targetValueEl) targetValueEl.textContent = String(game.target);
    }

    function getTileColor(value) {
      const palette = {
        2: "var(--tile-2)", 4: "var(--tile-4)", 8: "var(--tile-8)", 16: "var(--tile-16)", 32: "var(--tile-32)", 64: "var(--tile-64)",
        128: "var(--tile-128)", 256: "var(--tile-256)", 512: "var(--tile-512)", 1024: "var(--tile-1024)", 2048: "var(--tile-2048)",
        4096: "var(--tile-4096)", 8192: "var(--tile-8192)", 16384: "var(--tile-16384)", 32768: "var(--tile-32768)", 65536: "var(--tile-65536)"
      };
      return palette[value] || "linear-gradient(135deg, #2b2f45, #101725)";
    }

    function getTileFontSize(value) {
      if (value >= 32768) return "clamp(0.7rem, 1.4vw, 1rem)";
      if (value >= 16384) return "clamp(0.8rem, 1.6vw, 1.12rem)";
      if (value >= 1024) return "clamp(0.9rem, 2vw, 1.35rem)";
      if (value >= 128) return "clamp(1rem, 2vw, 1.65rem)";
      if (value >= 8) return "clamp(1.1rem, 2vw, 1.8rem)";
      return "clamp(1.2rem, 2vw, 1.9rem)";
    }

    function handleKeydown(event) {
      const map = {
        ArrowLeft: "left",
        ArrowRight: "right",
        ArrowUp: "up",
        ArrowDown: "down",
        a: "left",
        d: "right",
        w: "up",
        s: "down"
      };
      const direction = map[event.key];
      if (!direction) return;
      event.preventDefault();
      move(direction);
    }

    function move(direction) {
      if (game.state === "lost") return;
      if (game.mode === "ai" && game.aiBusy) return;
      if (game.mode === "duel" && game.currentPlayer !== 0) {
        showToast(i18n[game.lang].p2 + " turn");
        return;
      }

      const prev = cloneBoard(game.board);
      const result = shiftBoard(game.board, direction);
      if (!result.moved) {
        if (!hasAnyMove(game.board)) finishGame();
        else showToast(i18n[game.lang].noMoves);
        return;
      }

      pushHistory();
      game.board = result.board;
      game.score += result.gained;
      if (game.mode === "duel") {
        game.playerScores[game.currentPlayer] += result.gained;
        game.score = game.playerScores[game.currentPlayer];
        game.best = Math.max(game.best, Math.max(...game.playerScores));
      } else {
        game.best = Math.max(game.best, game.score);
      }
      localStorage.setItem(STORAGE_KEYS.best, String(game.best));

      spawnRandomTile(game.board);
      if (game.mode === "duel") {
        game.currentPlayer = 1 - game.currentPlayer;
        game.score = game.playerScores[game.currentPlayer];
      }

      if (game.score >= game.target && !game.wonOnce) {
        game.wonOnce = true;
        showToast(i18n[game.lang].won);
      }

      if (!hasAnyMove(game.board)) {
        finishGame();
      }

      renderBoard();
      if (JSON.stringify(prev) === JSON.stringify(game.board)) {
        showToast(i18n[game.lang].noMoves);
      }

      if (game.mode === "ai" && game.state === "playing") {
        scheduleAiMove();
      }
    }

    function scheduleAiMove() {
      if (game.aiBusy || game.mode !== "ai") return;
      game.aiBusy = true;
      els.turnValue.textContent = i18n[game.lang].aiTurn;
      setTimeout(() => {
        const moveDir = chooseAiMove(game.board);
        if (moveDir) {
          const prev = cloneBoard(game.board);
          const result = shiftBoard(game.board, moveDir);
          if (result.moved) {
            game.board = result.board;
            game.score += result.gained;
            game.best = Math.max(game.best, game.score);
            spawnRandomTile(game.board);
            if (game.score >= game.target && !game.wonOnce) {
              game.wonOnce = true;
              showToast(i18n[game.lang].won);
            }
          }
          renderBoard();
          if (!hasAnyMove(game.board)) finishGame();
        }
        game.aiBusy = false;
        els.turnValue.textContent = getTurnLabel();
      }, game.aiDelay);
    }

    function chooseAiMove(board) {
      const directions = ["up", "down", "left", "right"];
      let best = { dir: null, score: -Infinity };
      directions.forEach((dir) => {
        const cloned = cloneBoard(board);
        const result = shiftBoard(cloned, dir);
        if (!result.moved) return;
        const score = evaluateBoard(result.board) + result.gained * 12;
        if (score > best.score) best = { dir, score };
      });
      return best.dir;
    }

    function evaluateBoard(board) {
      let score = 0;
      for (let y = 0; y < board.length; y++) {
        for (let x = 0; x < board[y].length; x++) {
          const v = board[y][x];
          if (v === 0) score += 6;
          if (x + 1 < board[y].length) {
            const next = board[y][x + 1];
            if (v && next) score += Math.abs(v - next) * 0.4;
          }
          if (y + 1 < board.length) {
            const down = board[y + 1][x];
            if (v && down) score += Math.abs(v - down) * 0.4;
          }
          score += v * 0.5;
        }
      }
      return score;
    }

    function finishGame() {
      game.state = "lost";
      if (game.mode === "duel") {
        const p1 = game.playerScores[0];
        const p2 = game.playerScores[1];
        const result = p1 === p2 ? i18n[game.lang].draw : (p1 > p2 ? i18n[game.lang].duelWin + i18n[game.lang].p1 : i18n[game.lang].duelWin + i18n[game.lang].p2);
        showToast(result);
      } else {
        showToast(i18n[game.lang].lost);
      }
    }

    function shiftBoard(board, direction) {
      const size = board.length;
      let next = cloneBoard(board);
      let gained = 0;
      let moved = false;

      const lines = [];
      for (let i = 0; i < size; i++) {
        const line = [];
        if (direction === "left") {
          for (let x = 0; x < size; x++) line.push({ x, y: i });
        } else if (direction === "right") {
          for (let x = size - 1; x >= 0; x--) line.push({ x, y: i });
        } else if (direction === "up") {
          for (let y = 0; y < size; y++) line.push({ x: i, y });
        } else if (direction === "down") {
          for (let y = size - 1; y >= 0; y--) line.push({ x: i, y });
        }
        lines.push(line);
      }

      for (const line of lines) {
        const values = line.map(pos => next[pos.y][pos.x]).filter(v => v !== 0);
        const merged = [];
        let idx = 0;

        while (idx < values.length) {
          const current = values[idx];
          const nextValue = values[idx + 1];
          if (nextValue === current && current !== 0) {
            const resultVal = current * 2;
            merged.push(resultVal);
            gained += resultVal;
            idx += 2;
          } else {
            merged.push(current);
            idx += 1;
          }
        }

        while (merged.length < size) merged.push(0);
        line.forEach((pos, index) => {
          const raw = merged[index];
          const current = next[pos.y][pos.x];
          if (current !== raw) moved = true;
          next[pos.y][pos.x] = raw;
        });
      }

      return { board: next, moved, gained };
    }

    function hasAnyMove(board) {
      for (let y = 0; y < board.length; y++) {
        for (let x = 0; x < board[y].length; x++) {
          const v = board[y][x];
          if (v === 0) return true;
          const right = x + 1 < board[y].length ? board[y][x + 1] : null;
          const down = y + 1 < board.length ? board[y + 1][x] : null;
          if (right === v || down === v) return true;
        }
      }
      return false;
    }

    function validateBoard() {
      if (!Array.isArray(game.board) || game.board.length !== game.size) {
        game.board = emptyBoard(game.size);
        return;
      }
      for (let y = 0; y < game.board.length; y++) {
        if (!Array.isArray(game.board[y]) || game.board[y].length !== game.size) game.board[y] = Array(game.size).fill(0);
        for (let x = 0; x < game.board[y].length; x++) {
          const v = game.board[y][x];
          if (!Number.isFinite(v) || v < 0) {
            if (game.mode === "obstacle" && v === -1) continue;
            game.board[y][x] = 0;
          }
        }
      }
    }

    function showToast(msg) {
      const toast = els.toast;
      toast.textContent = msg;
      toast.classList.add("visible");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("visible"), 1700);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    }

    function openSaveModal() {
      renderSaveModal();
      els.saveModal.classList.remove("hidden");
    }

    function closeSaveModal() {
      els.saveModal.classList.add("hidden");
    }

    function renderSaveModal() {
      const saved = getSaves();
      const dict = i18n[game.lang] || i18n["zh-Hant"];
      els.saveList.innerHTML = "";
      saveSlots.forEach((slot) => {
        const card = document.createElement("div");
        card.className = "save-card";

        const meta = document.createElement("div");
        meta.className = "save-meta";

        const title = document.createElement("strong");
        title.textContent = `${dict.newSave} ${slot.replace("slot-", "")}`;

        const time = document.createElement("span");
        const saveInfo = saved[slot];
        time.textContent = saveInfo ? new Date(saveInfo.savedAt).toLocaleString() : dict.empty;

        meta.append(title, time);

        const actions = document.createElement("div");
        actions.className = "save-actions";

        const saveBtn = document.createElement("button");
        saveBtn.className = "save-slot";
        saveBtn.type = "button";
        saveBtn.dataset.action = "save-slot";
        saveBtn.dataset.slot = slot;
        saveBtn.textContent = saveInfo ? dict.overwrite : dict.save;

        const loadBtn = document.createElement("button");
        loadBtn.className = "load-slot";
        loadBtn.type = "button";
        loadBtn.dataset.action = "load-slot";
        loadBtn.dataset.slot = slot;
        loadBtn.textContent = dict.load;
        loadBtn.disabled = !saveInfo;
        if (!saveInfo) loadBtn.style.opacity = "0.5";

        actions.append(saveBtn, loadBtn);
        card.append(meta, actions);
        els.saveList.appendChild(card);
      });
    }

    function getSaves() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.saveSlots) || "{}") || {};
      } catch (e) {
        return {};
      }
    }

    function saveGame(slot) {
      const snapshot = {
        board: cloneBoard(game.board),
        score: game.score,
        best: game.best,
        size: game.size,
        target: game.target,
        mode: game.mode,
        playerScores: [...game.playerScores],
        currentPlayer: game.currentPlayer,
        savedAt: new Date().toISOString()
      };
      const saves = getSaves();
      saves[slot] = snapshot;
      localStorage.setItem(STORAGE_KEYS.saveSlots, JSON.stringify(saves));
      showToast(i18n[game.lang].saved);
      renderSaveModal();
    }

    function loadGame(slot) {
      const saves = getSaves();
      const snapshot = saves[slot];
      if (!snapshot) return;
      game.board = cloneBoard(snapshot.board || emptyBoard(snapshot.size || 4));
      game.score = snapshot.score || 0;
      game.best = snapshot.best || 0;
      game.size = snapshot.size || 4;
      game.target = snapshot.target || 2048;
      game.mode = snapshot.mode || "classic";
      game.playerScores = Array.isArray(snapshot.playerScores) ? [...snapshot.playerScores] : [0, 0];
      game.currentPlayer = typeof snapshot.currentPlayer === "number" ? snapshot.currentPlayer : 0;
      game.history = [];
      game.aiBusy = false;
      game.state = "playing";
      els.modeSelect.value = game.mode;
      updateModeSettings();
      localStorage.setItem(STORAGE_KEYS.best, String(game.best));
      renderBoard();
      closeSaveModal();
      showToast(i18n[game.lang].loaded);
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
